<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - aeinoder</title>
    <link rel="stylesheet" href="assets/css/base.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--vga-black);
        }
        
        .error-container {
            max-width: 600px;
            padding: 48px;
            background-color: var(--vga-black);
            border: 2px solid var(--vga-white);
            text-align: center;
        }
        
        .error-code {
            font-size: 96px;
            line-height: 1;
            margin: 0 0 24px 0;
            color: var(--vga-white);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
        }
        
        .error-message {
            font-size: 18px;
            line-height: 1.5;
            margin: 0 0 36px 0;
            color: var(--vga-white);
            font-family: 'Space Mono', monospace;
        }
        
        .home-link {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--vga-black);
            color: var(--vga-white);
            border: 2px solid var(--vga-white);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            transition: background-color 0.2s, color 0.2s;
        }
        
        .home-link:hover {
            background-color: var(--vga-white);
            color: var(--vga-black);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Page not found</p>
        <a href="/" class="home-link">Return Home</a>
    </div>
</body>
</html>
