name: Apply Gallery editor import fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-gallery-import-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false
      - name: Patch direct input-component imports
        shell: python
        run: |
          from pathlib import Path

          editor = Path('assets/js/admin/gallery-editor.js')
          text = editor.read_text()
          old = """import {\n  Heading,\n  Paragraph,\n  Button,\n  TextInput,\n  FileInput,\n  FileTable,\n  Select,\n} from '../shared/component-library.js';\n"""
          new = """import {\n  Heading,\n  Paragraph,\n  Button,\n  FileTable,\n  Select,\n} from '../shared/component-library.js';\nimport { TextInput } from '../shared/components/input/TextInput.js';\nimport { FileInput } from '../shared/components/input/FileInput.js';\n"""
          if old in text:
              editor.write_text(text.replace(old, new, 1))

          admin = Path('assets/js/sections/admin_section.js')
          text = admin.read_text()
          old = """import {\n  Heading,\n  Paragraph,\n  Button,\n  TextInput,\n} from '../shared/component-library.js';\n"""
          new = """import {\n  Heading,\n  Paragraph,\n  Button,\n} from '../shared/component-library.js';\nimport { TextInput } from '../shared/components/input/TextInput.js';\n"""
          if old in text:
              admin.write_text(text.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/admin/gallery-editor.js assets/js/sections/admin_section.js
          git commit -m 'Fix Gallery editor component imports'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
