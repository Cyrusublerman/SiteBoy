name: Validate PKL snapshot directly

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-pkl-snapshot.yml'
      - 'assets/js/shared/pkl-content-provider.js'
      - 'scripts/pkl/validate-public-graph.mjs'
      - 'tests/pkl-content-provider.test.js'
      - 'public/generated/pkl/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:run -- tests/pkl-content-provider.test.js tests/pkl-public-ui.test.js
      - run: npm run pkl:validate
      - run: npm run build
