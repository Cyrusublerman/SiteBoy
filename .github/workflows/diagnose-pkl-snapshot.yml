name: Diagnose PKL snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pkl-snapshot.yml'
      - 'assets/js/shared/pkl-content-provider.js'
      - 'tests/pkl-content-provider.test.js'
      - 'public/generated/pkl/**'

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.test.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: test
        shell: bash
        run: |
          set +e
          npx vitest run tests/pkl-content-provider.test.js --reporter=json --outputFile="${RUNNER_TEMP}/vitest.json"
          echo "exit_code=$?" >> "${GITHUB_OUTPUT}"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pkl-snapshot-diagnostics
          path: ${{ runner.temp }}/vitest.json

  diagnostics:
    if: always()
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkl-snapshot-diagnostics
          path: diagnostics
      - run: |
          node - <<'NODE'
          const value = JSON.parse(require('fs').readFileSync('diagnostics/vitest.json', 'utf8'));
          console.log(`${value.numPassedTests} passed, ${value.numFailedTests} failed`);
          for (const file of value.testResults || []) for (const test of file.assertionResults || []) {
            if (test.status === 'failed') {
              console.log(test.fullName);
              console.log((test.failureMessages || []).join('\n'));
            }
          }
          NODE
          test "${{ needs.capture.outputs.exit_code }}" = '0'
