name: Diagnose gallery editor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-gallery-editor.yml'
      - 'assets/js/admin/**'
      - 'assets/js/sections/admin_section.js'
      - 'assets/js/shared/gallery-upload.js'
      - 'assets/css/admin-editor.css'
      - 'api/admin/media/**'
      - 'db/schema.js'
      - 'src/main.js'
      - 'tests/gallery-admin-editor.test.js'
      - 'tests/gallery-upload-policy.test.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - name: Capture focused diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          npm run test:run -- tests/gallery-admin-editor.test.js tests/gallery-upload-policy.test.js > diagnostics.txt 2>&1
          TEST_STATUS=$?
          npm run build >> diagnostics.txt 2>&1
          BUILD_STATUS=$?
          echo "TEST_STATUS=$TEST_STATUS" >> diagnostics.txt
          echo "BUILD_STATUS=$BUILD_STATUS" >> diagnostics.txt
          echo "test_status=$TEST_STATUS" >> "$GITHUB_OUTPUT"
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-editor-diagnostics
          path: diagnostics.txt
      - name: Fail when diagnostics failed
        if: steps.diagnostics.outputs.test_status != '0' || steps.diagnostics.outputs.build_status != '0'
        run: |
          cat diagnostics.txt
          exit 1
