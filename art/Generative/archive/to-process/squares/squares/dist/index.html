  <html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Minute Optical Cycle - Aligned</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="optical-aligned.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="info">
    <h1>4-MINUTE CYCLE</h1>
    <div class="phase-name" id="phase-name"></div>
    <div class="sub-phase" id="sub-phase"></div>
    <div class="timer" id="timer">0:00 / 4:00</div>
  </div>
  <div class="controls">
    <button id="play">PAUSE</button>
    <button id="restart">RESTART</button>
    <button id="toggle-info">HIDE</button>
  </div>

  <script src="optical-aligned.js"></script>
</body>
