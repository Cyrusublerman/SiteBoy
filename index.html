<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEINODER - SiteBoy Framework</title>
    
    <!-- Space Mono Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- SiteBoy Framework Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <!-- Theme Initialization -->
    <script>
        // Initialize theme from localStorage before page renders
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'inverted') {
            document.documentElement.classList.add('inverted');
        }
    </script>
</head>
<body>
    <!-- App root - All content rendered by SiteBoy App -->
    <div id="app-root"></div>
    
    <!-- SiteBoy Framework Scripts - Canonical Loading Order (ESM) -->
    
    <!-- 1. Core foundation (Modular ES6) -->
    <script type="module" src="assets/js/shared/component-library.js"></script>
    <script>
        // Component library is now available globally via window.ComponentLibrary
        // No imports needed - UMD bundle handles everything
        
        console.log('🚀 SiteBoy Framework v4.0.0 - Modular Architecture Loaded');
        console.log('📊 F=12px Mathematical Precision System Active');
        console.log('🎨 VGA-Constrained Color Palette Ready');
        console.log('🔤 Space Mono Typography System Ready');
        console.log('🏗️ Component Libraries Ready (Bundled)');
        console.log('📄 JSON-Driven Content System Ready');
        console.log('📦 Modular Build System Active');
    </script>
    
    <!-- 2. Core App (with integrated routing) -->
    <script type="module" src="assets/js/core/app.js"></script>
    
    <!-- 4. Tools -->
    <script src="assets/js/tools/ui-test-tool.js"></script>
    
    <!-- 5. Sections -->
    <script src="assets/js/sections/home_section.js"></script>
    <script src="assets/js/sections/blog_section.js"></script>
    <script src="assets/js/sections/art_section.js"></script>
    <script src="assets/js/sections/tools_section.js"></script>
    <script src="assets/js/sections/projects_section.js"></script>
    

    <!-- Framework Ready -->
    <script>
        console.log('🎯 SiteBoy Framework v3.0.0 - Clean Architecture Complete');
        console.log('✅ Features: Integrated Routing, JSON Content, Component Library');
        console.log('📋 Clean 5-File Architecture: config → app → component-library → sections → styling');
    </script>
</body>
</html>
