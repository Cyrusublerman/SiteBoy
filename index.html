<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aeinoder</title>
    
    <!-- Third-party Libraries -->
    <!-- Prism.js core + Python (no theme CSS; custom VGA theme in components.css) -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <!-- MathJax for LaTeX rendering - reliable and well-supported -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- SiteBoy Framework Styles - Modular System -->
    <link rel="stylesheet" href="assets/css/index.css">
    
    <!-- Theme Initialization -->
    <script>
        // Initialize theme from localStorage before page renders
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'inverted') {
            document.documentElement.classList.add('inverted');
        }
    </script>
</head>
<body>
    <!-- App root - All content rendered by SiteBoy App -->
    <div id="app-root"></div>
    
    <!-- VITE Entry Point - Modern ES Module Loading -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
